[target.aarch64-linux-android]
linker = "aarch64-linux-android30-clang"

[target.armv7-linux-androideabi]
linker = "armv7a-linux-androideabi30-clang"

[target.armv-linux-androideabi]
linker = "armv7a-linux-androideabi30-clang"

[target.i686-linux-android]
linker = "i686-linux-android30-clang"

[target.x86_64-linux-android]
linker = "x86_64-linux-android30-clang"

[target.x86_64-pc-windows-msvc]
linker = "lld-link.exe"

[target.x86_64-uwp-windows-msvc]
linker = "lld-link.exe"

[target.i686-pc-windows-msvc]
linker = "lld-link.exe"

[target.aarch64-pc-windows-msvc]
linker = "lld-link.exe"

[target.aarch64-uwp-windows-msvc]
linker = "lld-link.exe"

[env]
CC_wasm32-wasip2 = "/opt/wasi-sdk/bin/clang"
CXX_wasm32-wasip2 = "/opt/wasi-sdk/bin/clang++"
AR_wasm32-wasip2 = "/opt/wasi-sdk/bin/llvm-ar"
CFLAGS_wasm32-wasip2 = "--sysroot=/opt/wasi-sdk/share/wasi-sysroot -mllvm -wasm-enable-sjlj -fwasm-exceptions"
CXXFLAGS_wasm32-wasip2 = "--sysroot=/opt/wasi-sdk/share/wasi-sysroot -mllvm -wasm-enable-sjlj -fwasm-exceptions"
MACOSX_DEPLOYMENT_TARGET = "13.0"
RUSTC_BOOTSTRAP = "crown,script,script_webgpu,script_bindings,style_tests,mozjs,mozjs_sys"

[build]
rustdocflags = ["--document-private-items"]

# --- wasm32-wasip2 port (branch wasip2-port) ---
# noeh libc++ + the wasi-sysroot -L are what make SpiderMonkey link;
# -mllvm -wasm-enable-sjlj -fwasm-exceptions is what makes C libraries
# using setjmp/longjmp compile. tokio on wasip2 needs --cfg tokio_unstable.
[target.wasm32-wasip2]
rustflags = [
  "--cfg", "tokio_unstable",
  "-L", "/opt/wasi-sdk/share/wasi-sysroot/lib/wasm32-wasip2",
  "-L", "/opt/wasi-sdk/share/wasi-sysroot/lib/wasm32-wasip2/noeh",
  "-C", "link-arg=-lc++",
  "-C", "link-arg=-lc++abi",
]
