[package]
name = "servo-allocator"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
description.workspace = true

[lib]
path = "lib.rs"

[features]
allocation-tracking = ["backtrace", "dep:rustc-hash", "log"]
use-system-allocator = ["libc"]

[dependencies]
backtrace = { workspace = true, optional = true }
log = { workspace = true, optional = true }
rustc-hash = { workspace = true, optional = true }

[target.'cfg(not(any(windows, target_env = "ohos", target_family = "wasm")))'.dependencies]
libc = { workspace = true, optional = true }
tikv-jemalloc-sys = { workspace = true }
tikv-jemallocator = { workspace = true }

# wasm32-wasip2: jemalloc has no wasm support — its build script hard-errors with
# "jemalloc does not support target: wasm32-wasip2" — so the guest uses Rust's
# System allocator over wasi-libc.
[target.'cfg(target_family = "wasm")'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Memory"] }

[target.'cfg(target_env = "ohos")'.dependencies]
libc = { workspace = true }
