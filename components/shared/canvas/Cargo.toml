[package]
name = "servo-canvas-traits"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
description.workspace = true

[lib]
name = "servo_canvas_traits"
path = "lib.rs"

[features]
webgl_backtrace = []

[dependencies]
crossbeam-channel = { workspace = true }
euclid = { workspace = true }
fonts_traits = { workspace = true }
kurbo = { workspace = true, features = ["serde"] }
log = { workspace = true }
malloc_size_of = { workspace = true }
malloc_size_of_derive = { workspace = true }
pixels = { workspace = true }
serde = { workspace = true }
servo-base = { workspace = true }
strum = { workspace = true }
stylo = { workspace = true }
webrender_api = { workspace = true }
webxr-api = { workspace = true }

# wasip2 port: glow selects its web backend on wasm32, which pulls
# web-sys/wasm-bindgen and emits imports a component cannot resolve.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
glow = { workspace = true }
